# === VETRINA artestramas3d.it ===
server {
    listen 80;
    server_name artestramas3d.it www.artestramas3d.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/vetrina;
    }

    location / {
        return 301 https://artestramas3d.it$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name artestramas3d.it www.artestramas3d.it;

    ssl_certificate /etc/letsencrypt/live/artestramas3d.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artestramas3d.it/privkey.pem;

    root /usr/share/nginx/vetrina;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# === CALCOLATORE ===
server {
    listen 80;
    server_name calcolatore.artestramas3d.it;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name calcolatore.artestramas3d.it;

    ssl_certificate /etc/letsencrypt/live/calcolatore.artestramas3d.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calcolatore.artestramas3d.it/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

